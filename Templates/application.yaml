AWSTemplateFormatVersion: '2010-09-09'

Description: 
  Stack 2 - Plan-Letting Application & Database
  Creates the ALB, Web ASG and connection to RDS and 
  Bastion Host in VPC A and Management EC2 in VPC B

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: Amazon Linux 2023 

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair for SSH access
    Default: vockey

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '[a-zA-Z0-9]*'
    ConstraintDescription: 8-41 letters and numbers only.
    Description: RDS master password , i have set the password in the Github secret Actions 

  DBEngineVersion:
    Type: String
    Default: '8.4.8'
    Description: MySQL 8.4

Resources:

  # Compute & Management instnaces 
  
  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: !Ref AmiId
      SubnetId: !ImportValue PlanLetting-VPCAPubSub1
      SecurityGroupIds:
        - !ImportValue PlanLetting-BastionSG
      Tags:
        - Key: Name
          Value: PlanLetting-Bastion-EC2

  ManagementInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: !Ref AmiId
      SubnetId: !ImportValue PlanLetting-VPCBPrivSub1
      SecurityGroupIds:
        - !ImportValue PlanLetting-MgmtSG
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          dnf install -y mariadb105
      Tags:
        - Key: Name
          Value: PlanLetting-Management-EC2
   
  # Database Tier for the RDS MySQL database, with a primary and a read replica in different AZs for high availability
  # ALB , internet facing with target groups 

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS instances in VPC B
      SubnetIds:
        - !ImportValue PlanLetting-VPCBPrivSub1
        - !ImportValue PlanLetting-VPCBPrivSub2

  PrimaryDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [ W1011 ]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: planletting-db-primary
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: !Ref DBEngineVersion
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !ImportValue PlanLetting-DBSG
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: PlanLetting-DB-Primary

  ReplicaDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: planletting-db-replica
      SourceDBInstanceIdentifier: !Ref PrimaryDatabase
      DBInstanceClass: db.t3.micro
      VPCSecurityGroups:
        - !ImportValue PlanLetting-DBSG
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: PlanLetting-DB-Replica

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: PlanLetting-Web-ALB
      Scheme: internet-facing
      Subnets:
        - !ImportValue PlanLetting-VPCAPubSub1
        - !ImportValue PlanLetting-VPCAPubSub2
      SecurityGroups:
        - !ImportValue PlanLetting-ALBSG
      Tags:
        - Key: Name
          Value: PlanLetting-ALB

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: PlanLetting-Web-TG
      VpcId: !ImportValue PlanLetting-VPCAId
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      TargetType: instance

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
          
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: PlanLetting-Web-LT
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t2.micro
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !ImportValue PlanLetting-WebSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            dnf install -y httpd php php-mysqlnd jq
            systemctl enable --now httpd
            mkdir -p /etc/planletting
            jq -n --arg h '${PrimaryDatabase.Endpoint.Address}' \
                  --arg r '${ReplicaDatabase.Endpoint.Address}' \
                  --arg u 'admin' --arg p '${DBPassword}' \
                  '{host:$h, replica:$r, username:$u, password:$p}' > /etc/planletting/db.json
            chown root:apache /etc/planletting/db.json
            chmod 640 /etc/planletting/db.json
            cat > /var/www/html/index.php <<'PHP'
            <?php
            $c = json_decode(file_get_contents('/etc/planletting/db.json'), true);
            echo "<h1>Welcome to Plan-Letting</h1>";
            echo "<p>Served by web server: " . gethostname() . "</p>";
            foreach (['Primary' => $c['host'], 'Read Replica' => $c['replica']] as $name => $host) {
              $db = @new mysqli($host, $c['username'], $c['password']);
              if ($db->connect_error) {
                echo "<p>$name database: CONNECTION FAILED</p>";
              } else {
                echo "<p>$name database connected - MySQL " . $db->server_info . "</p>";
                $db->close();
              }
            }
            PHP
            
  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: PlanLetting-Web-ASG
      VPCZoneIdentifier:
        - !ImportValue PlanLetting-VPCAPrivSub1
        - !ImportValue PlanLetting-VPCAPrivSub2
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      TargetGroupARNs:
        - !Ref ALBTargetGroup

Outputs:
  ALBDNSName:
    Description: Public URL 
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  BastionPublicIP:
    Description: Public IP of Bastion host for jumping into private VPC
    Value: !GetAtt BastionInstance.PublicIp

  ManagementPrivateIP:
    Description: Private IP of Management instance 
    Value: !GetAtt ManagementInstance.PrivateIp

  PrimaryDBEndpoint:
    Description: Primary MySQL database 
    Value: !GetAtt PrimaryDatabase.Endpoint.Address

  ReplicaDBEndpoint:
    Description: Read replica MySQL database 
    Value: !GetAtt ReplicaDatabase.Endpoint.Address
  