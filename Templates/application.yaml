AWSTemplateFormatVersion: '2010-09-09'

Description: 
  Stack 2 - Plan-Letting Application & Database
  Creates the ALB, Web ASG and connection to RDS and 
  Bastion Host in VPC A and Management EC2 in VPC B

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: Amazon Linux 2023 

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 KeyPair for SSH access
    Default: vockey

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '[a-zA-Z0-9]*'
    ConstraintDescription: 8-41 letters and numbers only.
    Description: RDS master password , i have set the password in the Github secret Actions 

  DBEngineVersion:
    Type: String
    Default: '8.4.8'
    Description: MySQL 8.4

Resources:

  # Compute & Management instnaces 
  
  # Bastion host dpleoyed in public VPC A for SSH access to private instances 
  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: !Ref AmiId
      SubnetId: !ImportValue PlanLetting-VPCAPubSub1
      SecurityGroupIds:
        - !ImportValue PlanLetting-BastionSG 
      Tags:
        - Key: Name
          Value: PlanLetting-Bastion-EC2

  # Management instance deployed in private VPC B for management and monitoring of the application and databases
  ManagementInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: !Ref AmiId
      SubnetId: !ImportValue PlanLetting-VPCBPrivSub1
      SecurityGroupIds:
        - !ImportValue PlanLetting-MgmtSG
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          dnf install -y mariadb105
      Tags:
        - Key: Name
          Value: PlanLetting-Management-EC2
   
  # Database Tier for the RDS MySQL database, with a primary and a read replica in different AZs for high availability
  # ALB , internet facing with target groups 

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for RDS instances in VPC B
      SubnetIds:
        - !ImportValue PlanLetting-VPCBPrivSub1
        - !ImportValue PlanLetting-VPCBPrivSub2
  
  # RDS MySQL database instances
  PrimaryDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [ W1011 ]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: planletting-db-primary
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: !Ref DBEngineVersion
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !ImportValue PlanLetting-DBSG
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: PlanLetting-DB-Primary

  # Read replica of the primary database for read scalability and high availability
  ReplicaDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: planletting-db-replica
      SourceDBInstanceIdentifier: !Ref PrimaryDatabase
      DBInstanceClass: db.t3.micro
      VPCSecurityGroups:
        - !ImportValue PlanLetting-DBSG
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: PlanLetting-DB-Replica

  # Application Load Balancer and Web Auto Scaling Group for the application tier
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: PlanLetting-Web-ALB
      Scheme: internet-facing
      Subnets:
        - !ImportValue PlanLetting-VPCAPubSub1
        - !ImportValue PlanLetting-VPCAPubSub2
      SecurityGroups:
        - !ImportValue PlanLetting-ALBSG
      Tags:
        - Key: Name
          Value: PlanLetting-ALB

  # Target group for the ALB to route traffic to the web instances
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: PlanLetting-Web-TG
      VpcId: !ImportValue PlanLetting-VPCAId
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      TargetType: instance

  # ALB Listener to forward traffic from the ALB to the target groups 
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # Launch template for the web instances in the ASG with the user data to install and configure the applicatio      
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: PlanLetting-Web-LT
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t2.micro
        KeyName: !Ref KeyName
        SecurityGroupIds:
          - !ImportValue PlanLetting-WebSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            dnf install -y httpd php php-mysqlnd jq
            systemctl enable --now httpd
            mkdir -p /etc/planletting
            jq -n --arg h '${PrimaryDatabase.Endpoint.Address}' \
                  --arg r '${ReplicaDatabase.Endpoint.Address}' \
                  --arg u 'admin' --arg p '${DBPassword}' \
                  '{host:$h, replica:$r, username:$u, password:$p}' > /etc/planletting/db.json
            chown root:apache /etc/planletting/db.json
            chmod 640 /etc/planletting/db.json
            cat > /var/www/html/index.php <<'HTML'
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>HLS Stream with SAS Token using Shaka Player</title>
                <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.11.7/dist/shaka-player.ui.min.js"></script>  
                <link href="https://cdn.jsdelivr.net/npm/shaka-player@4.11.7/dist/controls.min.css" rel="stylesheet">
                <style>
                    #quality-selection {
                        position: absolute;
                        top: 10px;
                        right: 10px;
                        background-color: white;
                        z-index: 10;
                        padding: 5px;
                        border-radius: 5px;
                        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
                    }
                </style>
            </head>
            <body>
                <h1>MP4 Stream with SAS Token using Default Player</h1>
                <video width="320" height="240" controls>
                    <source src="https://rahmana36afdendpoint10239-f4bfhrg9geajapa9.a03.azurefd.net/afdcontainer10239/AWS-Iac-Recording.mov?sp=r&st=2026-10-12T12:38:03Z&se=2026-10-21T20:53:03Z&spr=https&sv=2026-02-06&sr=c&sig=7xXxPEw0TUP%2BV%2BHRxR82UUaxnmEUPAGGjf78v1VD4Qg%3D" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <h1>HLS Stream with SAS Token using Shaka Player</h1>
                <video id="video" controls width="640" height="360" autoplay></video>

                <div id="log-container" style="margin-top: 10px; border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto;">
                    <strong>Load Time Logs:</strong>
                    <ul id="log-list"></ul>
                </div>

                <div id="quality-selection">
                    <label for="quality-levels">Select Quality: </label>
                    <select id="quality-levels"></select>
                </div>

                <script>
                    const sasToken = "sp=r&st=2026-10-12T12:38:03Z&se=2026-10-21T20:53:03Z&spr=https&sv=2026-02-06&sr=c&sig=7xXxPEw0TUP%2BV%2BHRxR82UUaxnmEUPAGGjf78v1VD4Qg%3D";
                    console.log(sasToken);

                    const video = document.getElementById('video');
                    const logList = document.getElementById('log-list');

                    const player = new shaka.Player(video);
                    player.addEventListener('error', onErrorEvent);

                    
                    const networkingEngine = player.getNetworkingEngine();
                    networkingEngine.registerRequestFilter(function (type, request) {
                        if (request.uris[0].includes('azurefd.net') && !request.uris[0].includes('sig=')) {
                            request.uris = request.uris.map(function(uri) {
                                const separator = uri.includes('?') ? '&' : '?';
                                return uri + separator + sasToken;
                            });
                        }
                    });

                    function onErrorEvent(event) {
                        console.error('Error code', event.detail.code, 'object', event.detail);
                    }

                    function populateQualitySelector() {
                        const qualitySelector = document.getElementById('quality-levels');
                        const tracks = player.getVariantTracks();
                        qualitySelector.innerHTML = '';
                        tracks.forEach(track => {
                            const option = document.createElement('option');
                            option.value = track.id;
                            option.text = (track.height ? track.height + 'p' : '') + ' (' + Math.round(track.bandwidth / 1000) + ' kbps)';
                            qualitySelector.appendChild(option);
                        });

                        const activeTrack = tracks.find(track => track.active);
                        if (activeTrack) {
                            qualitySelector.value = activeTrack.id;
                        }

                        qualitySelector.addEventListener('change', function (event) {
                            const selectedTrackId = parseInt(event.target.value);
                            const selectedTrack = tracks.find(track => track.id === selectedTrackId);
                            if (selectedTrack) {
                                player.configure({ abr: { enabled: false } });
                                player.selectVariantTrack(selectedTrack, true);
                            }
                        });
                    }

                    function logToPage(message) {
                        const li = document.createElement('li');
                        li.textContent = message;
                        logList.appendChild(li);
                    }

                    const observer = new PerformanceObserver(function (list) {
                        const entries = list.getEntries();
                        entries.forEach(function (entry) {
                            if (entry.initiatorType === 'fetch' || entry.initiatorType === 'xmlhttprequest') {
                                const url = new URL(entry.name);
                                if (url.pathname.includes('.ts') || url.pathname.includes('.m3u8')) {
                                    const loadTime = entry.responseEnd - entry.startTime;
                                    logToPage('Segment ' + url.pathname.split('/').pop() + ' loaded: ' + loadTime.toFixed(2) + ' ms');
                                }
                            }
                        });
                    });
                    observer.observe({ entryTypes: ['resource'] });

                    async function initPlayer() {
                        const manifestUri = 'https://rahmana36afdendpoint10239-f4bfhrg9geajapa9.a03.azurefd.net/afdcontainer10239/ABR/main.m3u8';
                        try {
                            await player.load(manifestUri);
                            populateQualitySelector();
                            console.log('The video has now been loaded!');
                        } catch (error) {
                            console.error('Error loading video', error);
                        }
                    }

                    initPlayer();
                </script>
            </body>
            </html>
            HTML
  # ASG for the web instances to handle traffic from the ALB and scale based on demand       
  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: PlanLetting-Web-ASG
      VPCZoneIdentifier:
        - !ImportValue PlanLetting-VPCAPrivSub1
        - !ImportValue PlanLetting-VPCAPrivSub2
      # Launch template for the web instances in the ASG with the user data to install and configure the application
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      TargetGroupARNs:
        - !Ref ALBTargetGroup

# Outputs for the stack to provide useful information about the resources created
Outputs:
  ALBDNSName:
    Description: Public URL 
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  BastionPublicIP:
    Description: Public IP of Bastion host for jumping into private VPC
    Value: !GetAtt BastionInstance.PublicIp

  ManagementPrivateIP:
    Description: Private IP of Management instance 
    Value: !GetAtt ManagementInstance.PrivateIp

  PrimaryDBEndpoint:
    Description: Primary MySQL database 
    Value: !GetAtt PrimaryDatabase.Endpoint.Address

  ReplicaDBEndpoint:
    Description: Read replica MySQL database 
    Value: !GetAtt ReplicaDatabase.Endpoint.Address
  